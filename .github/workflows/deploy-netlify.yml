name: Deploy online student council

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Deploy to Netlify
        run: npx -y netlify-cli@latest deploy --prod --allow-anonymous --site-name online-student-council-live --dir ./out --no-build