name: Deploy online student council to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-anonymous-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Deploy static output to Netlify
        id: netlify
        run: npx -y netlify-cli@latest deploy --prod --allow-anonymous --site-name online-student-council-live --dir ./out --no-build --json | tee netlify-deploy.json

      - name: Publish deploy details
        run: |
          echo "### Netlify deployment" >> "$GITHUB_STEP_SUMMARY"
          cat netlify-deploy.json >> "$GITHUB_STEP_SUMMARY"
